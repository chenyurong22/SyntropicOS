[platformio]
default_envs = native, stm32f4, esp32

[env:native]
platform = native
lib_deps = symlink://../../..
build_flags =
    -DSYN_LOG_COLOR=0
    -DSYN_USE_ETHERCAT=1
    -DSYN_USE_CANOPEN=1
    -DSYN_USE_FOC=1
    -DSYN_USE_BIQUAD=1

[env:stm32f4]
platform = ststm32
board = blackpill_f401cc
framework = stm32cube
lib_deps = symlink://../../..
build_flags =
    -DSYN_USE_ETHERCAT=1
    -DSYN_USE_CANOPEN=1
    -DSYN_USE_FOC=1
    -DSYN_USE_BIQUAD=1

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = symlink://../../..
build_flags =
    -DSYN_USE_ETHERCAT=1
    -DSYN_USE_CANOPEN=1
    -DSYN_USE_FOC=1
    -DSYN_USE_BIQUAD=1
